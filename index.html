<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>방탈출: 추리의 미궁</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Malgun Gothic', sans-serif; background: #1a1a1a; }
        #game-container { width: 100vw; height: 100vh; background-size: cover; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: background 0.5s; }
        #ui-layer { background: rgba(255,255,255,0.9); padding: 30px; border-radius: 20px; color: #333; text-align: center; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input { padding: 12px; font-size: 1.5em; width: 150px; text-align: center; margin-bottom: 15px; border: 2px solid #ccc; border-radius: 8px; }
        button { padding: 10px 20px; font-size: 1em; cursor: pointer; margin: 5px; border-radius: 8px; border: none; background: #4a90e2; color: white; transition: 0.3s; }
        button:hover { background: #357abd; }
        #timer { font-size: 2em; color: #d0021b; font-weight: bold; margin-bottom: 15px; }
        #hint-box { margin-top: 20px; border-top: 2px solid #eee; padding-top: 15px; }
        #final-message { font-size: 3.5em; color: #f5a623; font-weight: bold; display: none; text-shadow: 2px 2px 10px #000; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="ui-layer">
            <div id="timer">남은 시간: 60초</div>
            <h1 id="stage-title">1단계</h1>
            <p id="puzzle-desc" style="font-size: 1.2em; line-height: 1.6;"></p>
            <input type="password" id="password" placeholder="비밀번호 4자리" maxlength="4" autofocus>
            <br>
            <button onclick="checkAnswer()">확인</button>
            <div id="hint-box">
                <button onclick="showHint(0)">힌트 1 (난해함)</button>
                <button onclick="showHint(1)">힌트 2 (중급)</button>
                <button onclick="showHint(2)">힌트 3 (명쾌함)</button>
                <p id="hint-text" style="color:#555; font-size: 0.9em; height: 3em;"></p>
            </div>
            <p id="message" style="color:red; font-weight:bold;"></p>
        </div>
        <div id="final-message">축하합니다!</div>
    </div>
    <script>
        let currentStage = 0;
        let timeLeft = 60;
        let timerInterval;

        const stages = [
            { id: 1, bg: 'assets/bright_whimsical_toy_shop_bg.png', title: '장난감 가게의 수수께끼', answer: '4862', desc: '가게 주인의 나이는 그가 좋아하는 장난감 번호의 합과 같다. 장난감은 4, 8, 6번이다. 남은 한 숫자는?', hints: ['주인의 나이는 20세.', '4+8+6+x=20.', '답은 2입니다.'] },
            { id: 2, bg: 'assets/haunted_victorian_mansion_bg.png', title: '저택의 시간', answer: '1357', desc: '시계바늘은 홀수만 가리킨다. 1부터 9까지의 홀수 중 가장 작은 것부터 차례대로 4개를 입력하라.', hints: ['홀수의 정의를 떠올리세요.', '1, 3, 5, 7, 9...', '처음 4개입니다.'] },
            { id: 3, bg: 'assets/modern_smart_room_bg.png', title: '스마트 룸의 논리', answer: '2040', desc: '이 방은 2^n 규칙을 따른다. n이 9일 때 512, n이 10일 때 1024. n이 11일 때의 값의 마지막 자리를 0으로 바꾼 값은?', hints: ['2의 11승은 2048입니다.', '마지막 숫자를 0으로 바꿉니다.', '2040입니다.'] },
            { id: 4, bg: 'assets/pirate_cartographer_room_bg.png', title: '해적의 좌표', answer: '4321', desc: '보물은 거꾸로 가는 길에 있다. 1234의 반대 방향으로 4자리를 입력하라.', hints: ['1234를 뒤집으세요.', '좌표는 거꾸로 읽습니다.', '4321입니다.'] }
        ];
        
        // 엔터키 이벤트 추가
        document.getElementById('password').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        });

        function startTimer() {
            timeLeft = 60;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = `남은 시간: ${timeLeft}초`;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    alert('제한 시간 초과! 처음부터 다시 시작합니다.');
                    location.reload();
                }
            }, 1000);
        }

        function updateUI() {
            const stage = stages[currentStage];
            document.getElementById('game-container').style.backgroundImage = `url('${stage.bg}')`;
            document.getElementById('stage-title').innerText = `${stage.id}단계: ${stage.title}`;
            document.getElementById('puzzle-desc').innerText = stage.desc;
            document.getElementById('password').value = '';
            document.getElementById('message').innerText = '';
            document.getElementById('hint-text').innerText = '';
            document.getElementById('password').focus();
            startTimer();
        }

        function checkAnswer() {
            const inputField = document.getElementById('password');
            const input = inputField.value;
            if (input === stages[currentStage].answer) {
                if (currentStage < stages.length - 1) {
                    alert('축하합니다. 다음 단계로 넘어갑니다.');
                    currentStage++;
                    updateUI();
                } else {
                    clearInterval(timerInterval);
                    document.getElementById('ui-layer').style.display = 'none';
                    document.getElementById('final-message').style.display = 'block';
                }
            } else {
                document.getElementById('message').innerText = '비밀번호가 틀렸습니다.';
                inputField.value = ''; // 틀릴 경우 초기화
            }
        }

        function showHint(level) {
            document.getElementById('hint-text').innerText = '힌트: ' + stages[currentStage].hints[level];
        }

        updateUI();
    </script>
</body>
</html>
